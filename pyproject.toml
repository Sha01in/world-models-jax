[project]
name = "world-models-jax"
version = "0.1.0"
description = "JAX implementation of World Models on CarRacing-v3 and VizDoom"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda13]>=0.11.2,<0.12; sys_platform == 'linux'",
    "jax>=0.11.2,<0.12; sys_platform != 'linux'",
    "equinox>=0.13.8,<0.14",
    "optax>=0.2.8,<0.3",
    "gymnasium[box2d]==1.2.2",
    "shimmy>=1.0.0",
    "vizdoom==1.2.4",
    "cma",
    "opencv-python",
    "numpy",
    "tqdm",
    "matplotlib",
    "imageio",
    "ipykernel"
]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Match the supported runtime.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
